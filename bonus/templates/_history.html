<section class="history">
  <h2>{{ history_title|default("Операции") }}</h2>
  {% if items %}
  <ul>
    {% include "_history_items.html" %}
  </ul>
  {% if history_token is defined and history_token and history_has_more %}
  <div
    class="history-more"
    data-history-url="/c/{{ history_token }}/history"
    data-before="{{ history_next_before }}"
    data-has-more="1"
  >
    <button type="button" class="text-link history-more-btn">Показать ещё</button>
    <p class="muted history-more-status" aria-live="polite"></p>
  </div>
  {% endif %}
  {% else %}
  <p class="muted">Операций пока нет.</p>
  {% endif %}
</section>
