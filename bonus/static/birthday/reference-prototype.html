<title>Mugle Rest Подарок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: одна сцена-телефон 390x800; конверт по центру, карта выезжает вверх, CTA внизу. Одна тёмная тема по задумке. */
:root {
  --ink: #140809;
  --ink-2: #221012;
  --paper: #F4EBDD;
  --paper-2: #E6D7C2;
  --paper-3: #D6C4AB;
  --brand: #B91C1C;
  --teal: #19B8A3;
  --pink: #D81B60;
  --muted: #B7A59A;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-body);
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  box-sizing: border-box;
}
.stage {
  position: relative; flex: 1 1 auto; min-height: 0;
  width: 100%; max-width: 390px; max-height: 800px;
  border-radius: 32px; overflow: hidden;
  background:
    radial-gradient(120% 60% at 50% 62%, rgba(185,28,28,.38), transparent 62%),
    linear-gradient(180deg, var(--ink-2), var(--ink));
  box-shadow: 0 0 0 1px rgba(244,235,221,.08), 0 30px 60px rgba(0,0,0,.45);
  user-select: none; -webkit-user-select: none;
}
.bar {
  position: absolute; inset: 0 0 auto 0; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  padding-inline: 20px; z-index: 5;
}
.bar .tag { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.x {
  width: 36px; height: 36px; border: 0; border-radius: 50%; cursor: pointer;
  background: rgba(244,235,221,.1); color: var(--paper); font-size: 20px; line-height: 1;
}
.x:focus-visible, .btn:focus-visible, .link:focus-visible, .replay:focus-visible, .env-hit:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

.heads { position: absolute; inset: 60px 0 auto 0; height: 110px; z-index: 4; }
.head { position: absolute; inset: 0 24px auto; transition: opacity .6s ease, transform .6s ease; }
.head h1 { margin: 0; font: 700 28px/1.1 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.head p { margin: 10px 0 0; font-size: 15px; line-height: 1.4; color: var(--muted); max-width: 30ch; }
.head.b { opacity: 0; transform: translateY(10px); }
.p7 .head.a { opacity: 0; transform: translateY(-10px); }
.p7 .head.b { opacity: 1; transform: none; }

.giftwrap { position: absolute; left: 50%; top: 190px; width: 320px; height: 400px; margin-left: -160px; transform-origin: 50% 0; z-index: 3; }
.gift { position: relative; width: 100%; height: 100%; perspective: 900px; }
.part { position: absolute; left: 0; top: 120px; width: 320px; height: 220px; transition: transform .7s cubic-bezier(.5,0,.2,1), opacity .6s ease; }
.env-back { background: var(--paper-2); border-radius: 10px; z-index: 1; box-shadow: 0 24px 40px rgba(0,0,0,.4); }
.env-front {
  z-index: 3; border-radius: 10px;
  background: linear-gradient(160deg, #FBF4E9, var(--paper) 55%, #EADCC8);
  clip-path: polygon(0 28%, 50% 62%, 100% 28%, 100% 100%, 0 100%);
}
.flap { z-index: 4; transform-origin: 50% 0; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.45,0,.2,1), opacity 1s; }
.flap i { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 50% 62%); backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px 10px 0 0; }
.flap .out { background: linear-gradient(180deg, #FFF8EE, var(--paper)); }
.flap .in { background: linear-gradient(0deg, var(--paper-3), var(--paper-2)); transform: rotateY(180deg); }
.seal {
  position: absolute; left: 50%; top: 256px; width: 68px; height: 68px; margin: -34px 0 0 -34px; z-index: 6;
  border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #E04040, var(--brand) 55%, #7E1010);
  box-shadow: 0 6px 14px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.3), inset 0 2px 3px rgba(255,255,255,.25);
  transition: transform .45s ease, opacity .45s ease;
}
.seal span { font: 700 17px/1 var(--font-display); color: #F7D9D2; letter-spacing: -.04em; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
.seal::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.25); }
.env-hit { position: absolute; left: 0; top: 120px; width: 320px; height: 220px; z-index: 8; border: 0; background: none; cursor: pointer; border-radius: 10px; }

.card { position: absolute; left: 25px; top: 140px; width: 270px; z-index: 2; transform-origin: 50% 0; transform: translateY(0) scale(.5); transition: transform 1s cubic-bezier(.2,.85,.2,1); }
.tilt { transition: transform .35s ease-out; transform: perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); will-change: transform; }
.card img { display: block; width: 100%; height: auto; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); pointer-events: none; }

.p1 .seal { transform: scale(1.35); opacity: 0; }
.p2 .flap { transform: rotateX(180deg); }
.card { opacity: 0; }
.p2 .card { opacity: 1; }
.p3 .flap { z-index: 0; }
.p4 .card { transform: translateY(-140px) scale(1); transition: transform 1.6s cubic-bezier(.32,.72,.2,1); }
.p4 .env-back, .p4 .env-front, .p4 .flap, .p4 .seal { opacity: 0; transition: opacity 1s cubic-bezier(.4,0,.6,1); }
.p4 .env-back { box-shadow: none; }
.p1 .env-hit { pointer-events: none; }

.foot { position: absolute; inset: auto 0 0 0; height: 150px; z-index: 6; }
.foot .layer { position: absolute; inset: 0 20px 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; transition: opacity .5s ease, transform .5s ease; }
.foot .layer.cta { opacity: 0; transform: translateY(14px); pointer-events: none; }
.p1 .foot .layer.open { opacity: 0; pointer-events: none; transform: translateY(8px); }
.p7 .foot .layer.cta { opacity: 1; transform: none; pointer-events: auto; }
.btn {
  width: 100%; height: 56px; border: 0; border-radius: 28px; cursor: pointer;
  background: var(--paper); color: var(--ink);
  font: 800 16px/1 var(--font-body); letter-spacing: .01em;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .15s ease;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; }
.link { height: 40px; border: 0; background: none; color: var(--muted); font: 600 14px var(--font-body); cursor: pointer; border-radius: 12px; }

canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
.idle .gift { animation: bob 3.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(244,235,221,.35) } 60% { box-shadow: 0 0 0 12px rgba(244,235,221,0) } }
.idle .btn.open-btn { animation: pulse 2.2s ease-out infinite; }

.replay { background: rgba(244,235,221,.08); color: var(--paper); border: 0; border-radius: 20px; height: 40px; padding: 0 18px; font: 600 14px var(--font-body); cursor: pointer; flex: none; }

@media (prefers-reduced-motion: reduce) {
  .part, .card, .flap, .seal, .head, .foot .layer, .tilt { transition-duration: .01s !important; }
  .idle .gift, .idle .btn.open-btn { animation: none; }
}
</style>

      <div class="part env-front"></div>
      <div class="part flap" id="flap"><i class="out"></i><i class="in"></i></div>
      <div class="seal" id="seal"><span>mr</span></div>
      <button class="env-hit" id="envhit" type="button" aria-label="Открыть подарок"></button>
    </div>
  </div>

  <div class="foot">
    <div class="layer open">
      <button class="btn open-btn" id="open" type="button">Открыть</button>
    </div>
    <div class="layer cta">
      <button class="btn" id="go" type="button"><span id="gotext">Перейти к карте</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <canvas class="fx" id="fx"></canvas>
</div>
<button class="replay" id="replay" type="button">Показать ещё раз</button>

<script>
(function () {
  var stage = document.getElementById('stage');
  var wrap = document.getElementById('giftwrap');
  var card = document.getElementById('card');
  var tilt = document.getElementById('tilt');
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers = [], raf = 0, state = 'idle';

  function fit() {
    var h = stage.clientHeight;
    var k = Math.min(1, Math.max(.5, (h - 190 - 120) / 363));
    wrap.style.transform = 'scale(' + k + ')';
    var r = stage.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', fit);
  fit();

  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
  function clearAll() { timers.forEach(clearTimeout); timers = []; if (raf) cancelAnimationFrame(raf); raf = 0; ctx.clearRect(0, 0, cv.width, cv.height); }
  function phase(n) { stage.classList.add('p' + n); }

  function reset() {
    clearAll();
    stage.className = 'stage idle';
    state = 'idle';
    flat();
  }

  function open() {
    if (state !== 'idle') return;
    state = 'running';
    stage.classList.remove('idle');
    if (reduce) { [1,2,3,4,7].forEach(phase); state = 'done'; return; }
    phase(1);                                            // печать отпускает
    at(250, function () { phase(2); });                  // клапан откидывается
    at(650, function () { phase(3); });                  // клапан уходит за карту
    at(650, function () { phase(4); });                  // карта выезжает и растёт, конверт растворяется одновременно
    at(2350, function () { phase(7); burst(); state = 'done'; }); // всё готово: конфетти, заголовок, кнопка
  }

  var COLORS = ['#19B8A3', '#D81B60', '#F4EBDD', '#F2B544', '#E04040', '#8FE3D6'];
  function burst() {
    var s = stage.getBoundingClientRect(), c = card.getBoundingClientRect();
    var ox = c.left - s.left + c.width / 2, oy = c.top - s.top + c.height * .5;
    var P = [], i, W = s.width, H = s.height, t0 = performance.now(), last = t0;
    for (i = 0; i < 120; i++) {
      var a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1;
      var v = 4 + Math.random() * 7;
      P.push({ x: ox + (Math.random() - .5) * c.width * .6, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - .5) * .16,
        col: COLORS[i % COLORS.length], t: i % 5 === 0 ? 2 : (i % 2), w: 5 + Math.random() * 5, h: 8 + Math.random() * 7,
        ph: Math.random() * 6.28, delay: Math.random() * 450, born: false, age: 0, max: 3600 + Math.random() * 1200 });
    }
    (function step(now) {
      var dt = Math.min(40, now - last) / 16.67; last = now;
      var el = now - t0, alive = 0;
      ctx.clearRect(0, 0, W, H);
      P.forEach(function (p) {
        if (el < p.delay) { alive++; return; }
        p.age += dt * 16.67; if (p.age > p.max) return; alive++;
        p.vy += .09 * dt; var d = Math.pow(.985, dt); p.vx *= d; p.vy *= d;
        p.x += p.vx * dt; p.y += p.vy * dt + Math.min(p.age / 1200, 1) * .35 * dt; p.r += p.vr * dt; p.ph += .06 * dt;
        p.x += Math.sin(p.ph * .7) * .35 * dt;
        var fadeIn = Math.min(1, p.age / 180), fadeOut = p.age > p.max - 900 ? (p.max - p.age) / 900 : 1;
        ctx.globalAlpha = Math.max(0, Math.min(fadeIn, fadeOut));
        ctx.fillStyle = p.col; ctx.strokeStyle = p.col;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        if (p.t === 2) {
          ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
          for (var k = 0; k <= 10; k++) ctx.lineTo(k * 2.6 - 13, Math.sin(k * .9 + p.ph) * 4);
          ctx.stroke();
        } else {
          ctx.scale(1, Math.abs(Math.cos(p.ph)) * .8 + .2);
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.t ? p.h : p.w);
        }
        ctx.restore();
      });
      ctx.globalAlpha = 1;
      if (alive) raf = requestAnimationFrame(step); else { ctx.clearRect(0, 0, W, H); raf = 0; }
    })(t0);
  }

  function aim(e) {
    if (!stage.classList.contains('p7') || reduce) return;
    var r = card.getBoundingClientRect();
    var nx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (r.width / 2)));
    var ny = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (r.height / 2)));
    tilt.style.setProperty('--ry', (nx * 9).toFixed(2) + 'deg');
    tilt.style.setProperty('--rx', (-ny * 9).toFixed(2) + 'deg');
  }
  function flat() { tilt.style.setProperty('--rx', '0deg'); tilt.style.setProperty('--ry', '0deg'); }
  stage.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse' || e.buttons) aim(e); });
  stage.addEventListener('pointerdown', aim);
  stage.addEventListener('pointerup', flat);
  stage.addEventListener('pointerleave', flat);
  stage.addEventListener('pointercancel', flat);

  document.getElementById('open').addEventListener('click', open);
  document.getElementById('envhit').addEventListener('click', open);
  document.getElementById('close').addEventListener('click', reset);
  document.getElementById('replay').addEventListener('click', reset);
  document.getElementById('go').addEventListener('click', function () {
    var t = document.getElementById('gotext');
    t.textContent = 'Здесь откроется карта';
    at(1400, function () { t.textContent = 'Перейти к карте'; });
  });
})();
</script>
