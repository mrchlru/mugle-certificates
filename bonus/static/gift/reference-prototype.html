<title>Mugle Rest Распаковка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: слева-сверху телефон с экраном распаковки, под ним переключатели вида и цвета. Одна тёмная тема. */
:root { --bg:#140809; --fg:#F4EBDD; --muted:#B7A59A; --line:rgba(244,235,221,.14); --chip:rgba(244,235,221,.08);
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); margin: 0; box-sizing: border-box;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 12px; }
.phone { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; max-width: 390px; max-height: 800px; border-radius: 32px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 30px 60px rgba(0,0,0,.45); background: #140809; }
.controls { flex: none; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 14px; max-width: 390px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 18px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--muted); font: 600 13px var(--font-body); padding: 7px 12px; border-radius: 15px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.dots { display: inline-flex; gap: 8px; }
.dots button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.dots button[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg) inset; }
.again { border: 0; background: var(--chip); color: var(--fg); font: 600 13px var(--font-body); height: 34px; padding: 0 16px; border-radius: 17px; cursor: pointer; }
button:focus-visible { outline: 2px solid #19B8A3; outline-offset: 2px; }

/* Макет карты сотрудника: упрощённая копия .wallet-card из приложения, цвет берётся из --card */
.parking { position: absolute; left: -9999px; top: 0; }
.wallet-card { --card: #B91C1C; width: 340px; background: var(--card); color: #fff; border-radius: 26px; overflow: hidden; font-family: var(--font-body); }
.wallet-card.is-light { color: #1d1d1f; }
.wallet-top { display: flex; justify-content: space-between; align-items: flex-start; padding: 22px 22px 16px; }
.wallet-logo { border: 3px solid currentColor; padding: 4px 7px 5px; font: 700 20px/0.95 var(--font-body); letter-spacing: -.02em; }
.wallet-label { margin: 0; font: 800 11px var(--font-body); letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.wallet-balance { text-align: right; } .wallet-amount { margin: 6px 0 0; font: 800 34px/1 var(--font-body); }
.wallet-banner img { display: block; width: 100%; height: auto; }
.wallet-body { padding: 18px 22px 20px; }
.wallet-holder { margin: 8px 0 18px; font: 800 20px/1.2 var(--font-body); }
.wallet-code { background: #fff; border-radius: 14px; padding: 16px 0 12px; margin: 0 32px; text-align: center; color: #111; }
.bars { height: 54px; margin: 0 28px; background: repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 5px,#111 5px 6px,#fff 6px 9px,#111 9px 12px,#fff 12px 13px); }
.wallet-code-number { margin: 8px 0 0; font: 600 12px var(--font-body); letter-spacing: .3em; }
.wallet-meta { margin: 14px 0 0; font: 400 13px var(--font-body); opacity: .8; }
/*
 * gift-unwrap.css — стили экрана распаковки подарочной карты (День рождения, бартер и др.).
 * Эталон: reference-prototype.html. Классы с префиксом gu-, на остальную страницу не влияют.
 * Цвета фона и печати выставляет gift-unwrap.js из цвета карточки (переменные --gu-*).
 */
.gu {
  --gu-ink: #140809;
  --gu-paper: #F4EBDD;
  --gu-paper-2: #E6D7C2;
  --gu-paper-3: #D6C4AB;
  --gu-muted: #B7A59A;
  --gu-focus: #19B8A3;
  --gu-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --gu-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* ниже значения по умолчанию; реальные ставит JS из цвета карточки */
  --gu-bg-top: #221012; --gu-bg-bottom: #140809; --gu-glow: rgba(185,28,28,.4);
  --gu-seal: #B91C1C; --gu-seal-hi: #E04040; --gu-seal-lo: #7E1010; --gu-seal-ink: #F7D9D2;
  --gu-k: 1;

  position: fixed; inset: 0; z-index: 1000; overflow: hidden;
  background:
    radial-gradient(120% 60% at 50% 62%, var(--gu-glow), transparent 62%),
    linear-gradient(180deg, var(--gu-bg-top), var(--gu-bg-bottom));
  color: var(--gu-paper); font-family: var(--gu-body);
  -webkit-user-select: none; user-select: none;
  color-scheme: dark;
}
.gu--embedded { position: absolute; z-index: 1; border-radius: inherit; } /* для предпросмотра внутри блока */
.gu *, .gu *::before, .gu *::after { box-sizing: border-box; }
.gu button { font-family: inherit; }
.gu button:focus-visible { outline: 2px solid var(--gu-focus); outline-offset: 3px; }

/* колонка 430px по центру (на десктопе); на телефоне во всю ширину */
.gu__col { position: relative; width: 100%; max-width: 430px; height: 100%; margin: 0 auto; }

.gu__bar { position: absolute; inset: 0 0 auto 0; height: 56px; padding: env(safe-area-inset-top, 0px) 20px 0; box-sizing: content-box; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
.gu__tag { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gu-muted); }
.gu__x { width: 36px; height: 36px; border: 0; border-radius: 50%; cursor: pointer; background: rgba(244,235,221,.1); color: var(--gu-paper); font-size: 20px; line-height: 1; }

.gu__heads { position: absolute; inset: calc(60px + env(safe-area-inset-top, 0px)) 0 auto 0; height: 110px; z-index: 4; }
.gu__head { position: absolute; inset: 0 24px auto; transition: opacity .6s ease, transform .6s ease; }
.gu__head h1 { margin: 0; font: 700 28px/1.1 var(--gu-display); letter-spacing: -.02em; text-wrap: balance; color: var(--gu-paper); }
.gu__head p { margin: 10px 0 0; font-size: 15px; line-height: 1.4; color: var(--gu-muted); max-width: 30ch; }
.gu__head--b { opacity: 0; transform: translateY(10px); }
.gu.is-reveal .gu__head--a { opacity: 0; transform: translateY(-10px); }
.gu.is-reveal .gu__head--b { opacity: 1; transform: none; }

/* подарок: область 320x400, масштабируется --gu-k */
.gu__giftwrap { position: absolute; left: 50%; top: calc(190px + env(safe-area-inset-top, 0px)); width: 320px; height: 400px; margin-left: -160px; transform-origin: 50% 0; transform: scale(var(--gu-k)); z-index: 3; }
.gu__gift { position: relative; width: 100%; height: 100%; perspective: 900px; }
.gu__part { position: absolute; left: 0; top: 120px; width: 320px; height: 220px; transition: transform .7s cubic-bezier(.5,0,.2,1), opacity .6s ease; }
.gu__env-back { background: var(--gu-paper-2); border-radius: 10px; z-index: 1; box-shadow: 0 24px 40px rgba(0,0,0,.4); }
.gu__env-front { z-index: 3; border-radius: 10px; background: linear-gradient(160deg, #FBF4E9, var(--gu-paper) 55%, #EADCC8); clip-path: polygon(0 28%, 50% 62%, 100% 28%, 100% 100%, 0 100%); }
/* клапан: шарнир по верхней кромке, раскрывается углом ВВЕРХ (широкая часть внизу) */
.gu__flap { z-index: 4; transform-origin: 50% 0; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.45,0,.2,1), opacity 1s; }
.gu__flap i { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 50% 62%); backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px 10px 0 0; }
.gu__flap-out { background: linear-gradient(180deg, #FFF8EE, var(--gu-paper)); }
.gu__flap-in { background: linear-gradient(0deg, var(--gu-paper-3), var(--gu-paper-2)); transform: rotateY(180deg); } /* именно rotateY */
.gu__seal {
  position: absolute; left: 50%; top: 256px; width: 68px; height: 68px; margin: -34px 0 0 -34px; z-index: 6;
  border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, var(--gu-seal-hi), var(--gu-seal) 55%, var(--gu-seal-lo));
  box-shadow: 0 6px 14px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.3), inset 0 2px 3px rgba(255,255,255,.25);
  transition: transform .45s ease, opacity .45s ease;
}
.gu__seal span { font: 700 17px/1 var(--gu-display); color: var(--gu-seal-ink); letter-spacing: -.04em; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.gu__seal::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.25); }
.gu__hit { position: absolute; left: 0; top: 120px; width: 320px; height: 220px; z-index: 8; border: 0; background: none; cursor: pointer; border-radius: 10px; }

/* карта: внутри лежит реальный элемент карты в натуральном размере, уменьшенный до 270px */
.gu__card { position: absolute; left: 25px; top: 140px; width: 270px; z-index: 2; transform-origin: 50% 0; transform: translateY(0) scale(.5); opacity: 0; transition: transform 1s cubic-bezier(.2,.85,.2,1); pointer-events: none; }
.gu__fit { transform-origin: 0 0; }
.gu__fit > * { margin: 0 !important; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }

/* ШАГИ (накапливаются) */
.gu.is-seal .gu__seal { transform: scale(1.35); opacity: 0; }
.gu.is-seal .gu__hit { pointer-events: none; }
.gu.is-flap .gu__flap { transform: rotateX(180deg); }
.gu.is-flap .gu__card { opacity: 1; }
.gu.is-flapback .gu__flap { z-index: 0; }
/* карта выезжает и растёт, конверт растворяется ОДНОВРЕМЕННО */
.gu.is-card .gu__card { transform: translateY(-140px) scale(1); transition: transform 1.6s cubic-bezier(.32,.72,.2,1); }
.gu.is-card .gu__env-back, .gu.is-card .gu__env-front, .gu.is-card .gu__flap, .gu.is-card .gu__seal { opacity: 0; transition: opacity 1s cubic-bezier(.4,0,.6,1); }
.gu.is-card .gu__env-back { box-shadow: none; }
.gu.is-reveal .gu__card { pointer-events: auto; } /* наклон и штрихкод работают только на раскрытой карте */

/* низ: «Открыть» → «Перейти к карте» */
.gu__foot { position: absolute; inset: auto 0 0 0; height: 150px; z-index: 6; }
.gu__layer { position: absolute; inset: 0 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; justify-content: flex-end; transition: opacity .5s ease, transform .5s ease; }
.gu__layer--cta { opacity: 0; transform: translateY(14px); pointer-events: none; }
.gu.is-seal .gu__layer--open { opacity: 0; pointer-events: none; transform: translateY(8px); }
.gu.is-reveal .gu__layer--cta { opacity: 1; transform: none; pointer-events: auto; }
.gu__btn { width: 100%; height: 56px; border: 0; border-radius: 28px; cursor: pointer; background: var(--gu-paper); color: var(--gu-ink); font: 800 16px/1 var(--gu-body); letter-spacing: .01em; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s ease; }
.gu__btn:active { transform: scale(.97); }
.gu__btn svg { width: 18px; height: 18px; }

.gu__fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; } /* под кнопкой */

@keyframes gu-bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
@keyframes gu-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(244,235,221,.35) } 60% { box-shadow: 0 0 0 12px rgba(244,235,221,0) } }
.gu.is-idle .gu__gift { animation: gu-bob 3.2s ease-in-out infinite; }
.gu.is-idle .gu__btn--pulse { animation: gu-pulse 2.2s ease-out infinite; }

@media (prefers-reduced-motion: reduce) {
  .gu__part, .gu__card, .gu__flap, .gu__seal, .gu__head, .gu__layer { transition-duration: .01s !important; }
  .gu.is-idle .gu__gift, .gu.is-idle .gu__btn--pulse { animation: none; }
}

</style>

<script>
/*!
 * gift-unwrap.js — экран распаковки подарочной карты. Чистый JS, без зависимостей.
 * Подключать после app.js. Стили: gift-unwrap.css. Эталон: reference-prototype.html.
 *
 *   var u = GiftUnwrap.mount({
 *     card: document.querySelector('.wallet-card'),  // существующий элемент карты (переносится, не копируется)
 *     kind: 'birthday' | 'gift',                     // тексты (см. TEXTS ниже)
 *     color: '#FF5A00',                              // цвет карточки (то же значение, что в --card)
 *     firstName: 'Роман',                            // имя, без фамилии; можно не передавать
 *     segmentName: 'Бартер на все рестораны',        // для kind:'gift' показывается под заголовком
 *     brand: 'Mugle Rest',
 *     sealText: 'mr',
 *     onGo: function () { ... },                     // нажали «Перейти к карте» или ×
 *     container: null                                // элемент для встроенного предпросмотра; иначе на весь экран
 *   });
 *   u.destroy();                                     // убрать экран, вернуть карту на место, onGo НЕ вызывается

(function (global) {
  'use strict';

  var TIMING = { flap: 250, flapBack: 650, card: 650, reveal: 2350 }; // мс от нажатия «Открыть»
  var STEPS = ['is-seal', 'is-flap', 'is-flapback', 'is-card', 'is-reveal'];
  var CARD_W = 270;

  var TEXTS = {
    birthday: {
      introTitle: 'Вам подарок!',
      introText: function (o) { return o.brand + ' приготовил кое-что ко дню рождения'; },
      revealTitle: function (o) { return o.firstName ? 'С днём рождения, ' + o.firstName + '!' : 'С днём рождения!'; },
      revealText: function () { return 'Ваша подарочная карта уже ждёт'; }
    },
    gift: {
      introTitle: 'Вам подарок!',
      introText: function (o) { return o.brand + ' приготовил для вас карту'; },
      revealTitle: function (o) { return o.firstName ? 'Ваша карта, ' + o.firstName : 'Ваша карта'; },
      revealText: function (o) { return o.segmentName || 'Подарочная карта уже ждёт'; }
    }
  };

  /* ---------- цвета ---------- */
  function hex2rgb(h) {
    h = String(h || '').trim().replace('#', '');
    if (/^[0-9a-f]{3}$/i.test(h)) h = h.split('').map(function (c) { return c + c; }).join('');
    if (!/^[0-9a-f]{6}$/i.test(h)) return [185, 28, 28];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function mix(a, b, t) { // a в сторону b на долю t
    return [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * t); });
  }
  function css(rgb, alpha) { return alpha == null ? 'rgb(' + rgb.join(',') + ')' : 'rgba(' + rgb.join(',') + ',' + alpha + ')'; }
  function lum(rgb) {
    var c = rgb.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  var INK = [20, 8, 9], WHITE = [255, 255, 255], BLACK = [0, 0, 0];

  /** Переменные фона, печати и конфетти из цвета карточки. Работает для тёмных, светлых и чёрных цветов. */
  function palette(hex) {
    var a = hex2rgb(hex);
    var vis = a;
    for (var i = 0; i < 4 && lum(vis) < 0.08; i++) vis = mix(vis, WHITE, 0.16); // тёмный цвет: поднять, чтобы свечение было видно
    var seal = a;
    var light = lum(a) > 0.45;
    return {
      bgTop: css(mix(INK, vis, 0.3)),
      bgBottom: css(mix(INK, vis, 0.06)),
      glow: css(vis, 0.5),
      seal: css(seal),
      sealHi: css(mix(seal, WHITE, 0.25)),
      sealLo: css(mix(seal, BLACK, 0.4)),
      sealInk: light ? '#2A1A0A' : '#F7D9D2',
      confetti: [css(a), css(mix(a, WHITE, 0.35)), css(mix(a, WHITE, 0.65)), '#F4EBDD', '#FFFFFF', css(mix(a, BLACK, 0.25))]
    };
  }
  var BIRTHDAY_CONFETTI = ['#19B8A3', '#D81B60', '#F4EBDD', '#F2B544', '#E04040', '#8FE3D6'];

  /* ---------- конфетти ---------- */
  function confetti(canvas, o) {
    var ctx = canvas.getContext('2d');
    if (!ctx) return function () {};
    var P = [], i, raf = 0, stopped = false, t0 = performance.now(), last = t0;
    for (i = 0; i < 120; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1, v = 4 + Math.random() * 7;
      P.push({
        x: o.x + (Math.random() - 0.5) * o.spread, y: o.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.16, ph: Math.random() * 6.28,
        col: o.colors[i % o.colors.length], kind: i % 5 === 0 ? 2 : i % 2,
        w: 5 + Math.random() * 5, h: 8 + Math.random() * 7, delay: Math.random() * 450, age: 0, max: 3600 + Math.random() * 1200
      });
    }
    function step(now) {
      if (stopped) return;
      var dt = Math.min(40, now - last) / 16.67, el = now - t0, alive = 0;
      last = now;
      ctx.clearRect(0, 0, o.w, o.h);
      P.forEach(function (p) {
        if (el < p.delay) { alive++; return; }
        p.age += dt * 16.67;
        if (p.age > p.max) return;
        alive++;
        p.vy += 0.09 * dt;
        var d = Math.pow(0.985, dt);
        p.vx *= d; p.vy *= d;
        p.x += p.vx * dt + Math.sin(p.ph * 0.7) * 0.35 * dt;
        p.y += p.vy * dt + Math.min(p.age / 1200, 1) * 0.35 * dt;
        p.r += p.vr * dt; p.ph += 0.06 * dt;
        var fin = Math.min(1, p.age / 180), fout = p.age > p.max - 900 ? (p.max - p.age) / 900 : 1;
        ctx.globalAlpha = Math.max(0, Math.min(fin, fout));
        ctx.fillStyle = p.col; ctx.strokeStyle = p.col;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);

        }

  }

  /* ---------- экран ---------- */

    '<div class="gu__col">' +

        '<div class="gu__part gu__env-back"></div>' +
        '<div class="gu__card"><div class="gu__fit"></div></div>' +
        '<div class="gu__part gu__env-front"></div>' +
        '<div class="gu__part gu__flap"><i class="gu__flap-out"></i><i class="gu__flap-in"></i></div>' +
        '<div class="gu__seal"><span></span></div>' +
        '<button class="gu__hit" type="button" aria-label="Открыть подарок"></button>' +
      '</div></div>' +
      '<div class="gu__foot">' +

        '<div class="gu__layer gu__layer--cta"><button class="gu__btn gu__go" type="button"><span></span>' +

      '</div>' +
      '<canvas class="gu__fx" aria-hidden="true"></canvas>' +
    '</div>';

  function mount(opts) {
    var o = opts || {};
    var card = o.card;
    if (!card) throw new Error('GiftUnwrap: не передан элемент карты (card)');
    o.kind = o.kind === 'birthday' ? 'birthday' : 'gift';

    var T = TEXTS[o.kind];

    var nw = o.cardWidth || card.offsetWidth || 380;
    var nh = o.cardHeight || card.offsetHeight || 510;
    var cardH = Math.round(CARD_W * nh / nw);

    var embedded = !!o.container;

    root.setAttribute('role', 'dialog');

    var s = root.style;

    s.setProperty('--gu-seal', pal.seal); s.setProperty('--gu-seal-hi', pal.sealHi); s.setProperty('--gu-seal-lo', pal.sealLo); s.setProperty('--gu-seal-ink', pal.sealInk);

    function q(sel) { return root.querySelector(sel); }
    q('.gu__head--a h1').textContent = T.introTitle;
    q('.gu__head--a p').textContent = T.introText(o);
    q('.gu__head--b h1').textContent = T.revealTitle(o);
    q('.gu__head--b p').textContent = T.revealText(o);
    q('.gu__seal span').textContent = o.sealText || 'mr';
    q('.gu__open').textContent = o.openLabel || 'Открыть';
    q('.gu__go span').textContent = o.goLabel || 'Перейти к карте';

    cardBox.style.height = cardH + 'px';
    fit.style.width = nw + 'px'; fit.style.height = nh + 'px';
    fit.style.transform = 'scale(' + (CARD_W / nw) + ')';
    fit.appendChild(card); // переносим сам элемент: обработчики наклона и штрихкод остаются рабочими

<script>
(function () {
  var phone = document.getElementById('phone'), card = document.getElementById('card'), parking = document.getElementById('parking');
  var COLORS = [['#FF5A00','Оранжевый'],['#0D2A59','Тёмно-синий'],['#B91C1C','Красный'],['#00A8A8','Бирюзовый'],['#054B44','Тёмно-зелёный'],['#F8B941','Жёлтый'],['#111111','Чёрный']];
  var kind = 'birthday', color = '#B91C1C', inst = null;
  var CARD_W = 340, CARD_H = 0;
  function isLight(hex) { var c = GiftUnwrap.palette(hex); return c.sealInk === '#2A1A0A'; }
  function run() {
    if (inst) inst.destroy();
    card.style.setProperty('--card', color);
    card.classList.toggle('is-light', isLight(color));
    document.getElementById('holder').textContent = kind === 'birthday' ? 'Марков Роман, день рождения' : 'Марков Роман, бартер на все рестораны';
    CARD_H = CARD_H || card.offsetHeight;
    inst = GiftUnwrap.mount({ card: card, kind: kind, color: color, firstName: 'Роман', segmentName: 'Бартер на все рестораны', brand: 'Mugle Rest', sealText: 'mr',
      container: phone, cardWidth: CARD_W, cardHeight: CARD_H, onGo: function () { setTimeout(run, 1200); } });
  }
  var dots = document.getElementById('dots');
  COLORS.forEach(function (c) {
    var b = document.createElement('button'); b.type = 'button'; b.title = c[1]; b.setAttribute('aria-label', c[1]); b.style.background = c[0];
    b.setAttribute('aria-pressed', c[0] === color ? 'true' : 'false');
    b.addEventListener('click', function () { color = c[0]; [].forEach.call(dots.children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); run(); });
    dots.appendChild(b);
  });
  [].forEach.call(document.querySelectorAll('#kind button'), function (b) {
    b.addEventListener('click', function () { kind = b.getAttribute('data-v'); [].forEach.call(document.querySelectorAll('#kind button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); run(); });
  });
  document.getElementById('again').addEventListener('click', run);
  run();
})();
</script>
